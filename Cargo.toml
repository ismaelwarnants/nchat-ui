[package]
name = "nchat-ui"
version = "0.2.2"
edition = "2021"
rust-version = "1.95"
resolver = "3"
description = "Lightweight desktop chat UI (WhatsApp/Telegram) on top of nchat"
license = "MIT"
build = "build.rs"

[dependencies]
cxx = "1.0"
slint = { version = "1.19", default-features = false, features = [
    "unstable-winit-030",
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = "0.18"
arboard = { version = "3", default-features = false, features = ["image-data"] }
notify-rust = "4"
png = "0.17"
libc = "0.2"
emojis = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
resvg = "0.49"
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-aac", "symphonia-isomp4", "symphonia-flac", "symphonia-vorbis", "symphonia-ogg", "symphonia-wav"] }
ogg = "0.9"
cpal = "0.18"
opus = "0.4"
audiopus_sys = { version = "0.2", features = ["static"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[build-dependencies]
cxx-build = "1.0"
cmake = "0.1"
slint-build = "1.19"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
