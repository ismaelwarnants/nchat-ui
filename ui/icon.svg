<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b9bff"/>
      <stop offset="1" stop-color="#2346c8"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4e8ff"/>
      <stop offset="1" stop-color="#9ccaff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0a1f66" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- background squircle -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#shine)"/>
  <!-- back bubble (reply) -->
  <path d="M150 58h46a30 30 0 0 1 30 30v36a30 30 0 0 1-30 30h-2v24l-27-24h-17a30 30 0 0 1-30-30V88a30 30 0 0 1 30-30z"
        fill="url(#back)" filter="url(#shadow)"/>
  <!-- front bubble -->
  <path d="M62 92h92a32 32 0 0 1 32 32v44a32 32 0 0 1-32 32h-50l-36 28v-28h-6a32 32 0 0 1-32-32v-44a32 32 0 0 1 32-32z"
        fill="#ffffff" filter="url(#shadow)"/>
  <!-- typing dots -->
  <circle cx="78" cy="146" r="11" fill="#2f63e6"/>
  <circle cx="108" cy="146" r="11" fill="#2f63e6"/>
  <circle cx="138" cy="146" r="11" fill="#2f63e6"/>
</svg>
